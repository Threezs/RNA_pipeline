# Configuration for the GEO RNA-seq pipeline
# Keep metadata column names stable across projects.
geo_id: "GSEXXXXX"
control_group: "Control"
treatment_group: "Treatment"
sample_id_column: "sample_id"
group_column: "group"
gene_column: "Gene"
organism: "mouse"        # mouse or human
string_species: 10090    # 10090 = mouse; 9606 = human
tf_network_organism: "mouse"

thresholds:
  padj: 0.05
  log2fc: 1.0
  pval_wgcna: 0.05
  ppi_score: 400

modules:
  run_splicing: false
  run_survival: false    # requires explicitly supplied expression/clinical data
