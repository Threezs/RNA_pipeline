name: validate-template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Python utilities
        run: python -m py_compile scripts/validate_project.py scripts/record_run.py tests/test_validate_project.py
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate tracked template files
        run: |
          test -s README.md
          test -s config.yaml
          test -s Snakefile
          test -s docs/VALIDATION.md
          test -s templates/project/PROJECT_STATUS.yml
          test -s templates/literature/article_records.tsv

  r-preprocess-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install edgeR
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bioc::edgeR
            any::sessioninfo
          install-pandoc: false
          install-quarto: false
      - name: Run R preprocessing regression test
        run: Rscript tests/test_preprocess.R
