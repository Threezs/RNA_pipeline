name: validate-template

on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Python utilities
        run: python -m py_compile scripts/validate_project.py scripts/record_run.py tests/test_validate_project.py
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate tracked template files
        run: |
          test -s README.md
          test -s config.yaml
          test -s Snakefile
          test -s docs/VALIDATION.md
          test -s templates/project/PROJECT_STATUS.yml
          test -s templates/literature/article_records.tsv

  r-preprocess-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install edgeR via BiocManager
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager", repos = "https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install("edgeR", ask = FALSE, update = FALSE)'
      - name: Run R preprocessing regression test
        run: Rscript tests/test_preprocess.R
